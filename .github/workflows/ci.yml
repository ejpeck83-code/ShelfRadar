name: CI
on:
  pull_request:
  push:
    branches: [main, feature/lead-target-vertical]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: shelf_radar
          POSTGRES_PASSWORD: shelf_radar
          POSTGRES_DB: shelf_radar_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shelf_radar"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://shelf_radar:shelf_radar@127.0.0.1:5432/shelf_radar_test
      TEST_DATABASE_URL: postgresql://shelf_radar:shelf_radar@127.0.0.1:5432/shelf_radar_test
      SHELF_RADAR_DATA_MODE: fixture
      TARGET_ADAPTER_MODE: fixture
      LIVE_INGESTION_ENABLED: "false"
      FIXTURE_INGESTION_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.13.0
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
